name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mock deploy
        run: |
          mkdir -p deployed
          echo "${GITHUB_SHA}" > deployed/VERSION
          python -c "from ticket import make_number; print(make_number(2026, 'ИТ', 1))" > deployed/EXAMPLE
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-version
          path: deployed
